generated: '2026-08-12'
method: searched
source: https://carrd.co/docs/forms
note: >-
  Carrd's integration surface runs in ONE direction only: Carrd is the API CLIENT. A Pro
  Standard (or higher) Carrd site can push form submissions into a partner's API, and a Pro
  Plus site can post to an arbitrary URL or trigger a Zapier/Make/n8n automation. Carrd
  itself publishes no API, so no entry here can be modelled as a forkable two-source Arazzo
  workflow — there is no Carrd-side operationId to bind. Every entry is therefore
  LISTING-ONLY (arazzo: null). This is the surface that put Carrd in the harvest backlog
  via the marketing-integration-graph, and it is real, but it is consumption, not supply.
  Nothing here is fabricated: each partner below is named on a Carrd documentation page
  that returned HTTP 200 on 2026-08-12.
arazzo_status: not-authorable
arazzo_status_reason: >-
  Two-source Arazzo requires operations on both sides. Carrd has no public OpenAPI and no
  public operations, so only a partner-only (one-sided) workflow could be written, which
  would misrepresent it as a Carrd integration workflow.
