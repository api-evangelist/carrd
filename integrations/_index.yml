  - slug: custom-url
    label: Custom URL
    partner: null
    category: generic-http
    use_case: >-
      Custom form submits its contents to any URL the site owner supplies. Method AJAX / POST
      / GET; format Default (form-encoded), JSON, or XML; up to five custom request headers;
      per-field Submitted ID supports dotted namespacing (fields.firstname) in JSON/XML; UTM
      parameters (utm_source, utm_medium, utm_campaign, utm_term, utm_content) can be
      appended automatically. On AJAX, a 2xx response is treated as success and anything
      else as failure. NOTE — this is a browser-side form submission from the published
      Carrd site, NOT a server-originated webhook from Carrd, so it is not an event surface
      and no Webhooks pointer is emitted for it.
    docs: https://carrd.co/docs/forms/setting-up-a-custom-url-form
    direction: carrd-as-client
    catalog_match: null
    arazzo: null
