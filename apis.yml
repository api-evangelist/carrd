aid: carrd
name: Carrd
description: >-
  Carrd is a hosted no-code website builder for simple, fully responsive one-page sites —
  personal profiles, landing pages, portfolios, link pages and small campaign sites. Started
  as a side project by AJ (@ajlkn) and now operated by Carrd Inc., it offers a free tier of
  three sites and sixteen paid annual Pro tiers banded Lite, Standard and Plus, topping out
  at 1,000 sites. Carrd publishes no public API, no developer portal, no SDKs and no
  machine-readable specification; its only HTTP integration surface points outward, with
  Pro-tier form elements delivering submissions into twenty email/CRM platforms, Zapier,
  Make, n8n and Airtable, or to a URL the site owner supplies. Carrd is best understood as
  an API consumer rather than an API provider.
